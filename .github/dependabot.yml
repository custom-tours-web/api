# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 📦 Scan and update NuGet packages (.NET)
  - package-ecosystem: "nuget"
    # Look for .csproj or .sln files in the root directory
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "chore"
      - "dependencies"
    # Automatically group all minor/patch .NET updates into a single PR to reduce noise
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

  # ⚙️ Scan and update GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "chore"
      - "dependencies"
