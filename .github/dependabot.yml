# 🤖 Dependabot Configuration
# 📦 Automatically checks for dependency updates and creates pull requests.
#
# 📚 Documentation:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:

  # 📦 .NET / NuGet Dependencies
  - package-ecosystem: "nuget"
    directory: "/"

    # 🗓️ Check for updates every Monday
    schedule:
      interval: "weekly"
      day: "monday"

    # 🏷️ PR Labels
    labels:
      - "chore"
      - "dependencies"

    # 📦 Group all .NET dependencies into a single PR
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

    # 📝 Commit Message Convention
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # ⚙️ GitHub Actions Dependencies
  - package-ecosystem: "github-actions"
    directory: "/"

    # 🗓️ Check for updates every Monday
    schedule:
      interval: "weekly"
      day: "monday"

    # 🏷️ PR Labels
    labels:
      - "chore"
      - "dependencies"

    # 📝 Commit Message Convention
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
