# 🏷️ Release Naming & Tagging Templates
name-template: '🚀 v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# 🚫 Exclusion Rules
exclude-labels:
  - 'skip-changelog'

# 🗂️ Pull Request Categories
categories:
  - title: '🚀 Features'
    labels:
      - 'enhancement'
      - 'feature'

  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'

  - title: '♻️ Maintenance & Refactoring'
    labels:
      - 'chore'
      - 'refactor'
      - 'dependencies'

  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'

# 📝 Release Body Template
template: |
  ## ✨ What's Changed

  $CHANGES

  ---

  🔗 **Full Changelog:** https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  💖 **Thank you to everyone who contributed to this release!**
