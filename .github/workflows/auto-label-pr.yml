name: 🏷️ Auto Label & Assign PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

# 🔐 Required permissions to read repository contents and modify PR metadata
permissions:
  contents: read
  pull-requests: write

jobs:
  apply-labels-and-reviewers:
    name: 🏷️ Apply Labels & 👤 Assign Reviewers
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. BRANCH EVALUATION & AUTO-LABELING
      # ==========================================
      - name: 🔍 Evaluate Branch Name & Apply Label
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "🔍 Evaluating branch name: $BRANCH_NAME"

          # 🚀 Check for Feature branches
          if [[ "$BRANCH_NAME" =~ ^(feature|feat)/ ]]; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "enhancement"
              echo "✅ Added 'enhancement' label."

          # 🐛 Check for Bugfix branches
          elif [[ "$BRANCH_NAME" =~ ^(bug|fix|bugfix)/ ]]; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "bug"
              echo "🐛 Added 'bug' label."

          # ♻️ Check for Refactor / Chore branches
          elif [[ "$BRANCH_NAME" =~ ^(refactor|chore)/ ]]; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "chore"
              echo "🧹 Added 'chore' label."

          # 📚 Check for Documentation branches
          elif [[ "$BRANCH_NAME" =~ ^(docs)/ ]]; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "documentation"
              echo "📚 Added 'documentation' label."

          # ℹ️ Default fallback
          else
              echo "ℹ️ Branch name does not match known prefixes. No labels added."
          fi

      # ==========================================
      # 2. AUTO-ASSIGN REVIEWERS
      # ==========================================
      - name: 👤 Assign Code Reviewers
        # 🎯 Only auto-assign reviewers when the PR is initially created
        if: github.event.action == 'opened'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "👤 Assigning default reviewers to PR #$PR_NUMBER"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-reviewer "hariofficial"
