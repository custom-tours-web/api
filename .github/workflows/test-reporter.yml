name: 🧪 Tests & Reporter

# ⚙️ Workflow Triggers
on:
  pull_request:
    types: [opened, synchronize, reopened]

# 🔐 Security Permissions (Least Privilege)
permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  test-and-report:
    name: 🧪 Run Tests & Report
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. ENVIRONMENT & TOOLING SETUP
      # ==========================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: 🔧 Restore Local Tools
        run: dotnet tool restore

      # ==========================================
      # 2. BUILD & TEST EXECUTION
      # ==========================================
      - name: 🧹 Clean & Restore Dependencies
        run: dotnet cake ./scripts/build.cake --target="Restore"

      - name: 🏗️ Build Application
        run: dotnet cake ./scripts/build.cake --target="Build" --exclusive

      - name: 🧪 Execute Test Suite
        continue-on-error: true
        run: dotnet cake ./scripts/build.cake --target="Test" --exclusive

      # ==========================================
      # 3. TEST REPORTING
      # ==========================================
      - name: 📊 Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: always()
        with:
          files: "artifacts/TestResults/**/*.trx"
          check_name: "🧪 Run Tests"
