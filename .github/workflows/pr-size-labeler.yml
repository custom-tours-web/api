name: 📏 PR Size Labeler

# ⚙️ Workflow Triggers
on:
  pull_request:
    types: [opened, synchronize, reopened]

# 🔐 Security Permissions (Least Privilege)
permissions:
  pull-requests: write

jobs:
  label-size:
    name: 🏷️ Assign PR Size Label
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CALCULATE & APPLY PR SIZE LABELS
      # ==========================================
      - name: 📏 Calculate & Apply Size Label
        uses: pascalgn/size-label-action@56b489b027932ec0cf60438a1a5f1a19c8fc71ff # v0.5.7

        env:
          # 🔑 GitHub authentication token
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

          # 🚫 Excluded files and auto-generated manifests
          IGNORED: "package-lock.json, yarn.lock, packages.lock.json, *.csproj, **/*.generated.cs, **/*.g.cs, docs/*"
