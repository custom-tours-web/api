name: 📝 Release Drafter

# ⚙️ Workflow Triggers
on:
  push:
    # 🔀 Runs every time a PR is merged into main
    branches:
      - main

# 🔐 Security Permissions (Least Privilege)
permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    name: 📝 Update Release Draft
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. DRAFT RELEASE NOTES
      # ==========================================
      - name: 🚀 Draft Release Notes
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0

        env:
          # 🔑 GitHub authentication token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          # ⚙️ Release Drafter configuration
          config-name: release-drafter.yml
