name: "CodeQL Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run a full background scan every Sunday at midnight
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: 🔍 Analyze C# Code
    runs-on: ubuntu-latest
    permissions:
      # Required to upload the results to GitHub's Security tab
      security-events: write
      actions: read
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # "security-extended" runs extra, stricter security checks
          queries: security-extended

      # ------------------------------------------------------------------
      # THE BUILD STEP: CodeQL must observe the build to analyze C# code
      # ------------------------------------------------------------------
      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v4

      # NOTE: If Autobuild fails because of your custom Cake scripts,
      # comment out the Autobuild step above and uncomment the lines below:
      # - name: 🏗️ Manual Build
      #   run: dotnet build ./api.slnx -c Release

      - name: 📊 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
