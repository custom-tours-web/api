# ==============================================================================
# 🚀 .NET API Continuous Integration (CI) Workflow via Cake
#
# 🔄 Orchestrates restoring, building, testing, reporting, and packaging the
# .NET solution via the central build.cake script.
#
# 📊 Publishes test and coverage metrics directly to GitHub Pull Requests
# and Step Summaries.
# ==============================================================================

name: 🚀 CI

on:
  push:
    branches: [ main, pro ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]
  workflow_dispatch:

# 🔄 Prevents duplicate runs and cancels outdated builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 🔐 Elevated permissions required for test and coverage actions
# to annotate Pull Requests and publish checks
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-test-and-package:
    name: 📊 Build, Test & Verify
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

      # 🔒 Enables deterministic LockedMode for Cake Restore
      CI: true

    steps:

      # 📥 Source Code
      - name: 🛒 Checkout Code
        uses: actions/checkout@v7

      # ⚙️ .NET Environment
      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

          # ⚡ Enables NuGet caching to speed up builds
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # 🔧 Local Tools
      - name: 🔧 Restore Local Tools
        # 📦 Restores dotnet-cake and reportgenerator
        # if they are defined in dotnet-tools.json
        run: dotnet tool restore

      # 🧹 Restore
      - name: 🧹 Clean & Restore
        run: dotnet cake ./scripts/build.cake --target="Restore"

      # 🏗️ Build
      - name: 🏗️ Build App
        run: dotnet cake ./scripts/build.cake --target="Build" --exclusive

      # 🧪 Tests
      - name: 🧪 Run Tests
        run: dotnet cake ./scripts/build.cake --target="Test" --exclusive

      # 🧬 Mutation Tests
      - name: 🧬 Run Mutation Tests
        run: dotnet cake ./scripts/build.cake --target="Mutation-Test" --exclusive

      # 📦 Packaging
      - name: 📦 Package App
        run: dotnet cake ./scripts/build.cake --target="Package" --exclusive

      # 📊 Reporting & Artifacts
      # 📋 Unit Test Results
      - name: 📋 Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          # 🎯 Give this check a specific name in the GitHub UI
          check_name: "🧪 Unit Test Results"
          # 📄 Read ONLY the UT TRX file
          files: "artifacts/TestResults/ut/**/*.trx"

      # 🧪 Unit Test Coverage
      - name: 📈 Publish Unit Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0

        if: always()

        with:
          # 🎯 Only reads Unit Test coverage
          filename: "artifacts/TestResults/ut/coverage.cobertura.xml"

          # 🏅 Generate coverage badge
          badge: true

          # 📝 Generate Markdown output
          format: markdown
          output: both

          # 📊 Include coverage indicators
          indicators: true

          # 🎯 Minimum threshold: 80%
          thresholds: '1 80'

      # Write UT Coverage to Summary
      - name: 📝 Write UT Coverage to Job Summary
        if: always()
        run: |
          echo "### 🧪 Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # 📋 Integration Test Results
      - name: 📋 Publish Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          # 🎯 Give this check a specific name in the GitHub UI
          check_name: "🔗 Integration Test Results"
          # 📄 Read ONLY the IT TRX file
          files: "artifacts/TestResults/it/**/*.trx"

      # 🔗 Integration Test Coverage
      - name: 📈 Publish Integration Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0

        if: always()

        with:
          # 🎯 Only reads Integration Test coverage
          filename: "artifacts/TestResults/it/coverage.cobertura.xml"

          # 🏅 Generate coverage badge
          badge: true

          # 📝 Generate Markdown output
          format: markdown
          output: both

          # 📊 Include coverage indicators
          indicators: true

          # 🎯 Minimum threshold: 70%
          thresholds: '1 70'

      # 📦 Upload Unit & Integration Test Artifacts
      - name: 📦 Upload Test Results & Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-and-integration-test-results
          path: artifacts/TestResults/
          if-no-files-found: warn

      # 🧬 Mutation Test Report Artifacts
      - name: 📦 Upload Mutation Test HTML Report
        uses: actions/upload-artifact@v7

        # 🔄 Always publish artifacts, even when tests or mutation thresholds fail
        if: always()

        with:
          # 📄 Name of the downloadable artifact ZIP in the GitHub UI
          name: stryker-mutation-report

          # 🎯 Search path for Stryker's generated output directory
          path: "StrykerOutput/**/reports/*"

          # ⚠️ Warn instead of failing if Stryker didn't generate a report
          if-no-files-found: warn

      # Write IT Coverage to Summary
      - name: 📝 Write IT Coverage to Job Summary
        if: always()
        run: |
          echo "### 🔗 Integration Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # 🧬 Publish Mutation Summary to GitHub Job Summary
      - name: 📝 Write Mutation Report to Summary
        if: always() # Ensures it runs even if mutation testing fails the threshold
        run: |
          echo "### 🧬 Stryker Mutation Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Find the markdown report inside the dynamically generated timestamp folder
          REPORT_FILE=$(find StrykerOutput -name "mutation-report.md" | head -n 1)

          if [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ *Mutation report not found. Check the Stryker logs for errors.*" >> $GITHUB_STEP_SUMMARY
          fi

          # Add a divider for the next summary items
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # 📦 Upload Compiled Application (Release DLLs)
      - name: 📦 Upload App Release Binaries
        uses: actions/upload-artifact@v4

        # 🔄 Only upload if the pipeline succeeded up to this point
        if: success()

        with:
          # 📄 Name of the downloadable artifact ZIP in the GitHub UI
          name: app-release-binaries

          # 🎯 Path where your Cake 'Package' task outputs the published DLLs.
          # ⚠️ Check your build.cake 'publishDir' variable to confirm this path!
          path: artifacts/publish/

          # 🚨 Fail the step if it can't find the published files
          if-no-files-found: error
