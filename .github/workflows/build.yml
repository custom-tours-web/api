# ==============================================================================
# 🚀 .NET API Continuous Integration (CI) Workflow via Cake
#
# Orchestrates restoring, building, testing, reporting, and packaging the
# .NET solution via the central build.cake script. Publishes metrics directly
# to GitHub Pull Requests and Step Summaries.
# ==============================================================================

name: CI

on:
  push:
    branches: [ main, pro ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Elevated permissions required for test and coverage actions to annotate PRs
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-test-and-package:
    name: 📊 Build, Test, and Verify
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Tells your Cake Restore task to use deterministic LockedMode
      CI: true

    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v7

      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # Enables NuGet caching to shave 30-60 seconds off your build times
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: 🔧 Restore Local Tools
        # Restores dotnet-cake and reportgenerator if they are in dotnet-tools.json
        run: dotnet tool restore

      - name: 🧹 Clean & Restore
        run: dotnet cake ./scripts/build.cake --target="Restore"

      - name: 🏗️ Build App
        run: dotnet cake ./scripts/build.cake --target="Build" --exclusive

      - name: 🧪 Run Tests
        run: dotnet cake ./scripts/build.cake --target="Test" --exclusive

      - name: 📦 Package App
        run: dotnet cake ./scripts/build.cake --target="Package" --exclusive

      # ========================================================================
      # 📊 Reporting & Artifacts
      # ========================================================================

      - name: 📋 Publish Test Results (.trx)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() # Run even if tests fail
        with:
          # Reads the isolated TRX files generated by your Cake script in the root artifacts folder
          files: "artifacts/TestResults/**/*.trx"

      # ---------------------------------------------------
      # Publish Unit Tests Code Coverage Summary
      # ---------------------------------------------------
      - name: 📈 Publish Unit Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          # 👇 Only grabs coverage from folders with "unit" in the name
          filename: "artifacts/TestResults/ut/coverage.cobertura.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '1 80'

      - name: 📝 Save UT Markdown
        if: always()
        # The action hardcodes the output name. We must rename it so the next step doesn't overwrite it.
        run: mv code-coverage-results.md ut-coverage-results.md

      # ---------------------------------------------------
      # Publish Integration Tests Code Coverage Summary
      # ---------------------------------------------------
      - name: 📈 Publish Integration Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          # 👇 Only grabs coverage from folders with "integration" in the name
          filename: "artifacts/TestResults/it/coverage.cobertura.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '1 70'

      # ---------------------------------------------------
      # Write to UI
      # ---------------------------------------------------
      - name: 📝 Write Coverages to Job Summary
        if: always()
        run: |
          # Add Unit Test section with spacing
          echo "### 🧪 Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat ut-coverage-results.md >> $GITHUB_STEP_SUMMARY

          # Add spacing and a horizontal divider
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add Integration Test section with spacing
          echo "### 🔗 Integration Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
