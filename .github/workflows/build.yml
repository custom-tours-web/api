# ==============================================================================
# 🚀 .NET API Continuous Integration (CI) Workflow via Cake
#
# Orchestrates restoring, building, testing, reporting, and packaging the
# .NET solution via the central build.cake script. Publishes metrics directly
# to GitHub Pull Requests and Step Summaries.
# ==============================================================================

name: CI

on:
  push:
    branches: [ main, pro ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Elevated permissions required for test and coverage actions to annotate PRs
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-test-and-package:
    name: Build, Test, and Verify
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Tells your Cake Restore task to use deterministic LockedMode
      CI: true

    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v7

      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # Enables NuGet caching to shave 30-60 seconds off your build times
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: 🔧 Restore Local Tools
        # Restores dotnet-cake and reportgenerator if they are in dotnet-tools.json
        run: dotnet tool restore

      # ========================================================================
      # 🎂 Cake Pipeline Execution
      # ========================================================================

      - name: 🧹 Clean & Restore
        run: dotnet cake build.cake --target="Restore"

      - name: 🏗️ Build App
        run: dotnet cake build.cake --target="Build" --exclusive

      - name: 🧪 Run Tests
        run: dotnet cake build.cake --target="Test" --exclusive

      - name: 📦 Package App
        run: dotnet cake build.cake --target="Package" --exclusive

      # ========================================================================
      # 📊 Reporting & Artifacts
      # ========================================================================

      - name: 📋 Publish Test Results (.trx)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() # Run even if tests fail
        with:
          # Reads the isolated TRX files generated by your Cake script in the root artifacts folder
          files: "artifacts/TestResults/**/*.trx"

      - name: 📈 Publish Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          # Reads the isolated XML files generated by your Cake script
          filename: "artifacts/TestResults/**/coverage.cobertura.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '1 80'
          fail_below_min: true

      - name: 📝 Write Coverage to Job Summary
        if: always()
        # Uses native bash to pipe the markdown file to the GitHub Actions UI
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: 📦 Upload Test Report Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: artifacts/TestResults/
          retention-days: 1

      - name: 🚀 Upload Application Publish Artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-publish
          path: artifacts/publish/
          retention-days: 1
